name: Vessel Position Tracker

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

# Avoid overlapping runs while the workflow updates the CSV.
concurrency:
  group: shipfinder-vessel-position-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated CSV back to the repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (with OS dependencies)
        run: python -m playwright install --with-deps chromium

      - name: Fetch active vessel positions
        run: |
          # The vessel list is cached in the repository by the Daily Vessel
          # Position Sync workflow, so scrape runs never call the website API
          # (which would wake the serverless database every two hours).
          if [ ! -f required_vessels.txt ]; then
            echo "required_vessels.txt is missing; run the Daily Vessel Position Sync workflow to create it." >&2
            exit 1
          fi
          if [ ! -s required_vessels.txt ]; then
            echo "No vessels currently require tracking; nothing to scrape."
            exit 0
          fi

          cp vessel_positions.csv /tmp/vessel_positions.before.csv

          fetch_failed=0
          while IFS= read -r vessel; do
            [ -n "$vessel" ] || continue
            echo "Fetching position for: $vessel"
            if ! python shipfinder_vessel_position.py "$vessel" --headless --output vessel_positions.csv; then
              echo "Retrying failed vessel: $vessel" >&2
              if ! python shipfinder_vessel_position.py "$vessel" --headless --output vessel_positions.csv; then
                echo "Both attempts failed for vessel: $vessel" >&2
                fetch_failed=1
              fi
            fi
          done < required_vessels.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_ROWS_FILE=/tmp/vessel_positions.new_rows.csv
          comm -13 <(sort /tmp/vessel_positions.before.csv) <(sort vessel_positions.csv) > "$NEW_ROWS_FILE" || true

          if [ -s "$NEW_ROWS_FILE" ]; then
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git checkout origin/main -- vessel_positions.csv
              cat "$NEW_ROWS_FILE" >> vessel_positions.csv
              git add vessel_positions.csv
              if git diff --cached --quiet; then
                echo "The latest CSV already contains this run's rows."
                break
              fi
              git commit -m "Update vessel positions [skip ci] $(date -u '+%Y-%m-%d %H:%M UTC')"
              if git push origin HEAD:main; then
                echo "CSV push succeeded on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "CSV push failed after multiple attempts." >&2
                exit 1
              fi
              echo "CSV push failed (attempt $attempt), retrying..."
              git reset --hard origin/main
              sleep $((attempt * 5))
            done
          else
            echo "No new rows fetched this run; nothing to commit."
          fi

          if [ "$fetch_failed" -ne 0 ]; then
            echo "One or more vessel fetches failed after retry." >&2
            exit 1
          fi
