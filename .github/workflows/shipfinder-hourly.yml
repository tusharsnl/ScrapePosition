name: Hourly ShipFinder Vessel Position Tracker

on:
  schedule:
    # Runs 7 minutes past every hour (UTC). Avoid the exact top-of-hour
    # (":00") minute, since it is the most congested slot on GitHub's
    # scheduler and scheduled runs are more likely to be delayed or
    # silently dropped there. GitHub may still delay this by a few
    # minutes during high load; exact-minute timing is not guaranteed.
    - cron: "7 * * * *"
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab

# Avoid overlapping runs stepping on each other's CSV commit.
concurrency:
  group: shipfinder-vessel-position-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated CSV back to the repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (with OS dependencies)
        run: python -m playwright install --with-deps chromium

      - name: Fetch vessel positions
        run: |
          # Snapshot the CSV as it existed at checkout time, so we can later
          # compute exactly which rows this run added (independent of what
          # other concurrent runs may commit in the meantime).
          cp vessel_positions.csv /tmp/vessel_positions.before.csv

          fetch() {
            python shipfinder_vessel_position.py "$1" --headless --output vessel_positions.csv || \
            python shipfinder_vessel_position.py "$1" --headless --output vessel_positions.csv || true
          }
          fetch "WAN HAI 517"
          fetch "9400186"
          fetch "REN JIAN 19"
          fetch "MSC DITTE"
          fetch "EVER LEARNED"
          fetch "HAIAN EAST"
          fetch "ITAL USODIMARE"

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rows this run added, regardless of what else may have changed
          # the file remotely in the meantime.
          NEW_ROWS_FILE=/tmp/vessel_positions.new_rows.csv
          comm -13 <(sort /tmp/vessel_positions.before.csv) <(sort vessel_positions.csv) > "$NEW_ROWS_FILE" || true

          if [ ! -s "$NEW_ROWS_FILE" ]; then
            echo "No new rows fetched this run; nothing to commit."
            exit 0
          fi

          # Another concurrent/overlapping run (e.g. a manual trigger racing
          # the scheduled one) may push in the meantime. Re-fetch the latest
          # remote CSV and re-append just this run's new rows before each
          # retry, instead of failing outright on a rejected push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout origin/main -- vessel_positions.csv
            cat "$NEW_ROWS_FILE" >> vessel_positions.csv
            git add vessel_positions.csv
            git commit -m "Update vessel positions [skip ci] $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main && { echo "Push succeeded on attempt $attempt."; exit 0; }
            echo "Push failed (attempt $attempt), retrying..."
            git reset --hard origin/main
            sleep $((attempt * 5))
          done
          echo "Push failed after multiple attempts." >&2
          exit 1
